name: Verify backend security gate

"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Verify toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import sys
          assert sys.version_info[:2] == (3, 12), sys.version
          print("SECURITY_PYTHON_VERSION_GATE=PASS")
          PY

      - name: Install pinned security tooling
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            "bandit==1.9.4" \
            "pip-audit==2.10.1" \
            "detect-secrets==1.5.0"
          mkdir -p build-security

      - name: SAST — Bandit
        id: bandit
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          bandit -r src \
            --format json \
            --output build-security/bandit.json

      - name: Working-tree secret scan — detect-secrets
        id: secrets
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          detect-secrets scan \
            --all-files \
            --exclude-files '(^|/)\.git/|^build-security/' \
            > /tmp/detect-secrets.json

          python - <<'PY'
          import json
          from pathlib import Path

          raw_path = Path("/tmp/detect-secrets.json")
          data = json.loads(raw_path.read_text(encoding="utf-8"))
          results = data.get("results") or {}

          findings = []
          for path, items in results.items():
              for item in items or []:
                  findings.append({
                      "path": path,
                      "line_number": item.get("line_number"),
                      "type": item.get("type"),
                  })

          summary = {
              "finding_count": len(findings),
              "findings": findings,
              "raw_secret_values_persisted": False,
          }
          Path("build-security/secret-scan-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True),
              encoding="utf-8",
          )

          # The full scanner output can contain hashed fingerprints and stays ephemeral.
          raw_path.unlink(missing_ok=True)

          if findings:
              print(f"SECRET_SCAN_GATE=FAIL findings={len(findings)}")
              raise SystemExit(1)

          print("SECRET_SCAN_GATE=PASS findings=0")
          PY

      - name: Runtime dependency audit + CycloneDX SBOM — pip-audit
        id: dependencies
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail

          # Mirror the Python dependency set installed by the production Dockerfile:
          #   pip install --no-cache-dir '.[stt]'
          #
          # Use a PEP 508 local project reference with the same `stt` extra so the
          # audit/SBOM covers the base project dependencies plus faster-whisper and
          # its resolved transitive dependency graph.
          printf '%s\n' \
            "orkio-v2-premium-backend[stt] @ file://${GITHUB_WORKSPACE}" \
            > /tmp/orkio-runtime-requirements.txt

          pip-audit \
            --requirement /tmp/orkio-runtime-requirements.txt \
            --strict \
            --format cyclonedx-json \
            --output build-security/runtime-dependency-audit.cdx.json \
            --progress-spinner off

      - name: Record security evidence metadata
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p build-security
          {
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "sha=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "python=$(python --version 2>&1 || true)"
            echo "bandit=$(bandit --version 2>&1 | head -n 1 || true)"
            echo "pip_audit=$(pip-audit --version 2>&1 || true)"
            echo "detect_secrets=$(detect-secrets --version 2>&1 || true)"
            echo "bandit_outcome=${{ steps.bandit.outcome }}"
            echo "secret_scan_outcome=${{ steps.secrets.outcome }}"
            echo "dependency_audit_outcome=${{ steps.dependencies.outcome }}"
            echo "runtime_dependency_target=orkio-v2-premium-backend[stt]"
            echo "runtime_dependency_resolution=strict"
            echo "sbom_file=runtime-dependency-audit.cdx.json"
            echo "github_token_permissions=contents:read"
            echo "checkout_persist_credentials=false"
          } > build-security/security-metadata.txt

      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4 series immutable SHA
        with:
          name: orkio-backend-security-evidence
          path: build-security/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Enforce security gate
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          failed=0

          if [ "${{ steps.bandit.outcome }}" != "success" ]; then
            echo "BANDIT_GATE=FAIL"
            failed=1
          else
            echo "BANDIT_GATE=PASS"
          fi

          if [ "${{ steps.secrets.outcome }}" != "success" ]; then
            echo "SECRET_SCAN_GATE=FAIL"
            failed=1
          else
            echo "SECRET_SCAN_GATE=PASS"
          fi

          if [ "${{ steps.dependencies.outcome }}" != "success" ]; then
            echo "DEPENDENCY_AUDIT_GATE=FAIL"
            failed=1
          else
            echo "DEPENDENCY_AUDIT_GATE=PASS"
          fi

          if [ "$failed" -ne 0 ]; then
            echo "BACKEND_SECURITY_GATE=FAIL"
            exit 1
          fi

          echo "BACKEND_SECURITY_GATE=PASS"
